name: EyeLine
options:
  bundleIdPrefix: com.theorange
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  EyeLine:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EyeLine
    info:
      path: EyeLine/App/Info.plist
      properties:
        CFBundleDisplayName: EyeLine
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "EyeLine uses your front camera to record you while you read your script from the teleprompter."
        NSMicrophoneUsageDescription: "EyeLine records audio with your video and listens to your speech so the teleprompter can follow along as you talk."
        NSSpeechRecognitionUsageDescription: "EyeLine uses on-device speech recognition to match what you're saying to your script, so the teleprompter can scroll automatically as you speak."
        NSPhotoLibraryAddUsageDescription: "EyeLine saves your finished recordings to your Photos library."
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theorange.eyeline
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
    dependencies: []

  EyeLineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EyeLineTests
    dependencies:
      - target: EyeLine

schemes:
  EyeLine:
    build:
      targets:
        EyeLine: all
        EyeLineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EyeLineTests
